chapters:
- n: 1
  title: Hello! Suas primeiras frases
  goal: Apresentar-se em voz alta em 30 segundos (nome, cidade, trabalho)
  topics:
  - verbo to be
  - pronomes
  - cumprimentos
  - como ler a pronúncia
  - como montar sua revisão espaçada
  minutes: 60
  sources_original: []
- n: 2
  title: Perguntas, números e horários
  goal: Pedir e dar nome, telefone, e-mail soletrado e horário
  topics:
  - wh-questions
  - números
  - horas e datas
  - alfabeto
  minutes: 60
  sources_original: []
- n: 3
  title: Minha rotina e meu trabalho
  goal: Descrever sua rotina e sua função no trabalho em 6 frases
  topics:
  - presente simples
  - do/does
  - advérbios de frequência
  - profissões
  minutes: 70
  sources_original: []
- n: 4
  title: 'Viagem I: aeroporto, hotel e restaurante'
  goal: Fazer check-in, pedir comida e resolver um pedido simples
  topics:
  - can/could/would like
  - some/any
  - how much/how many
  - diálogos de viagem
  minutes: 70
  sources_original: []
- n: 5
  title: 'Agora e depois: agenda e planos'
  goal: Marcar uma reunião e dizer o que está fazendo e o que vai fazer
  topics:
  - presente contínuo
  - going to
  - in/on/at
  - agenda
  minutes: 70
  sources_original: []
- n: 6
  title: Contando o que aconteceu
  goal: Contar sua última viagem ou semana de trabalho em 8 frases no passado
  topics:
  - passado simples
  - verbos irregulares
  - conectores de sequência
  minutes: 75
  sources_original: []
- n: 7
  title: E-mails de trabalho
  goal: Ler, escrever e responder um e-mail de trabalho de 80 a 120 palavras
  topics:
  - estrutura do e-mail
  - registro
  - frases prontas
  - pedir e confirmar
  minutes: 75
  sources_original: []
- n: 8
  title: Lendo documentação técnica
  goal: Seguir as instruções de uma página de documentação e resumir em português o que ela pede
  topics:
  - skimming e scanning
  - falsos cognatos
  - imperativo
  - must/should/may
  minutes: 75
  sources_original: []
- n: 9
  title: 'Conversas mais longas: experiências e opiniões'
  goal: Falar 2 minutos sobre experiências e comparar duas opções dando sua opinião
  topics:
  - present perfect
  - comparativos
  - opinião
  - small talk
  minutes: 80
  sources_original: []
- n: 10
  title: Imprevistos, ligações e videochamadas
  goal: 'Resolver um problema numa ligação: explicar, propor solução e confirmar'
  topics:
  - will
  - primeira condicional
  - pedir repetição
  - reuniões online
  minutes: 80
  sources_original: []
- n: 11
  title: 'Projeto final: uma semana de trabalho no exterior'
  goal: Entregar 2 e-mails, 1 resumo de documentação e uma conversa de 5 minutos gravada, avaliados pela
    lista B1
  topics:
  - simulação integrada
  - autoavaliação CEFR
  - plano de continuidade
  minutes: 120
  sources_original: []
