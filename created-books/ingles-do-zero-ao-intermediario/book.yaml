progress:
- n: 1
  done: '2026-11-27'
  summary: 'Ensinou o verbo to be (am/is/are e contrações), pronomes pessoais, cumprimentos, a/an, leitura
    de IPA com aproximação em português e revisão espaçada 1-3-7 dias. Exemplos: Lucy (Manchester) e Bruno
    (São Paulo), Ana Lima (Recife). Erros tratados: I have 30 years, falta de sujeito, Good night. I work
    at e I live in aparecem só como blocos prontos.'
- n: 2
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou perguntas com what/where/when/who/how + to be (ordem palavra+am/is/are+sujeito, What
    time), números 0-100 e -teen x -ty, telefone dígito a dígito, horas (past/to, o''clock), at/on/in,
    datas com ordinais e EUA x Reino Unido, alfabeto e soletrar e-mail (at, dot). Exemplos: Lucy e Bruno
    Souza registrando em evento, bruno.souza@example.com. How do you spell apareceu só como bloco pronto.'
- n: 3
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou presente simples (-s da 3ª pessoa, grafia -es/-ies/has, pronúncia /s/ /z/ /ɪz/), do/does
    em perguntas e negativas com verbo na forma base, exceção do to be, advérbios de frequência e posição
    (never já é negativo), vocabulário de trabalho e preposições at/in/for/on. Analogia do crachá para
    o -s. Exemplos: rotina de Lucy em 6 frases. Erros: She work, Does she works, I check always, don''t
    never.'
- n: 4
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou pedidos educados (Can/Could I have, I''d like, Would you like, I''m afraid; I want
    soa seco), vocabulário de aeroporto/hotel/restaurante com variantes UK/US, gorjeta sem valores, alergia
    com aviso, some/any (exceção em ofertas), contáveis x incontáveis (analogia tijolo e areia), how much/how
    many, a lot of. Diálogos: check-in de Lucy, hotel de Bruno, restaurante de Lucy. Is there... apareceu
    só como bloco pronto. Erros: informations, luggages, pass x passport.'
- n: 5
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou presente contínuo (am/is/are + -ing, negativa e pergunta sem do, grafia -ing, verbos
    de estado), going to (plano e previsão com evidência, gonna só reconhecer), contínuo x going to, in/on/at
    (at night, at/on the weekend, in + período), frases para marcar reunião, fuso (my time/your time,
    UTC), agenda = pauta. Analogia da gravação x transmissão ao vivo. Exemplos: Lucy (Manchester) e Bruno
    (São Paulo) marcando quinta às 2 p.m. Erros: I meeting, I''m knowing, in Monday, I going to.'
- n: 6
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou passado simples regular (-ed, grafia, três sons /t/ /d/ /ɪd/), 30 verbos irregulares
    (was/were, went, wrote, sent, took...), did/didn''t + forma base, exceção do to be (was/were sem did),
    marcadores de tempo (yesterday, last week, ago, on/in) e conectores first/then/after that/later/finally.
    Analogia do carimbo no passaporte. Exemplos: semana de Lucy (Londres), viagem e atraso de Bruno. Erros:
    Did you went, goed/buyed, I go to Rome last year, have been + last year só citado (cap. 9).'
- n: 7
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou a estrutura do e-mail de trabalho (assunto, saudação, abertura/motivo, pedido com
    próximo passo, fecho), registro formal x informal x neutro, frases prontas (Could you please, Let
    me know if, I''ve attached, Please find attached), vocabulário (reply all, Cc, Bcc, attachment), falsos
    cognatos actually/pretend, nota Thanks in advance como interpretação, segurança contra phishing e
    dados fictícios com IA, leitura rápida em 3 perguntas. Exemplos: Bruno e Lucy remarcando reunião (86
    e 81 palavras), Ana Lima formal, Sam. I''ll só como bloco (will no cap. 10).'
- n: 8
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou skimming e scanning (roteiro de 5 passos: objetivo, requisitos, avisos antes dos passos,
    passos, troubleshooting), cognatos verdadeiros e falsos cognatos técnicos (eventually, support, attend,
    realize; actually do cap. 7), imperativo em instruções (do not/don''t) e must/should/may/need to/must
    not/don''t have to, sem to e sem -s. Analogia das placas de trânsito. Exemplos: páginas fictícias
    da Notesync (instalação e troca de senha) com resumo em português. If you see/before you start só
    como blocos (if no cap. 10).'
- n: 9
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou present perfect (have/has + particípio, contrações, been/gone/seen/done/written/taken/eaten/spoken),
    usos: experiência com ever/never, for x since e How long, resultado agora, just/already/yet; regra
    passado simples (data definida) x present perfect. Comparativos e superlativos (-er/-est, more/most,
    better/worse, than, as...as). Opinião (I think/In my opinion/I''d say, because/so/although, I agree,
    I see your point but), small talk (responda e devolva). Analogia foto datada x álbum aberto. Exemplos:
    Lucy e Bruno em Londres. Erros: I live here since, have been in 2023, more better, I am agree. Fluência
    60-45-30 s como repetição sem atribuir.'
- n: 10
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Ensinou will (decisão na hora, oferta, promessa; won''t; sem to e sem -s) x going to, primeira
    condicional (if + presente simples, will + verbo; nunca if will; when/unless), pedir repetição e esclarecer
    (could you repeat, more slowly, Let me check I understood, I didn''t catch that, soletrar), frases
    de telefone e videochamada (on mute, breaking up, share screen), confirmação por escrito e privacidade
    (gravar só a própria voz). Analogia botão agora x agenda preenchida. Exemplos: Bruno e Sam (suporte
    Acme), reserva de hotel. Erros: If I will go, I will to call, If she come.'
- n: 11
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Projeto final: semana fictícia no exterior com 2 e-mails (formal para Ms Clark e neutro para
    Alex, 80-120 palavras), resumo em português de documentação do Wi-Fi (Visitor Wi-Fi Quick guide fictício)
    com 3 perguntas em inglês, conversa gravada de 5 minutos em 4 blocos, listas de checagem B1, autoavaliação
    de 10 linhas (notas 1-3, não é certificação, escrita para o livro, não copia o Companion Volume) e
    plano de 20 min/dia. Gravar só a própria voz, dados fictícios. Não ensina conteúdo novo.'
