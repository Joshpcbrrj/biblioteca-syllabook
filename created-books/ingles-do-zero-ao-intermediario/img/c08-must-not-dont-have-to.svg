<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img"><title>Must not e don't have to têm sentidos opostos</title><desc>Na dúvida, procure a palavra not logo depois de must: a frase proíbe.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Must not e don't have to têm sentidos opostos</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="113.80000000000001" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="109.80000000000001" width="423.0" height="54.0" rx="12" fill="#FFD3C5" stroke="#EE9478" stroke-width="2"/><text x="249.5" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#963019">must not = é proibido</text><rect x="499.0" y="113.80000000000001" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="109.80000000000001" width="423.0" height="54.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#17694A">don't have to = não é obrigatório</text><rect x="38" y="175.8" width="423.0" height="48.0" rx="10" fill="#FFEBE4" stroke="#EE9478" stroke-width="2"/><text x="249.5" y="202.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">You must not share your password.</text><rect x="499.0" y="175.8" width="423.0" height="48.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="202.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">You don't have to use a phone.</text><rect x="38" y="233.8" width="423.0" height="48.0" rx="10" fill="#FFEBE4" stroke="#EE9478" stroke-width="2"/><text x="249.5" y="260.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Não faça. É contra a regra.</text><rect x="499.0" y="233.8" width="423.0" height="48.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="260.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Você pode fazer ou não. Tanto faz.</text><rect x="38" y="291.8" width="423.0" height="48.0" rx="10" fill="#FFEBE4" stroke="#EE9478" stroke-width="2"/><text x="249.5" y="318.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Do not close the app.</text><rect x="499.0" y="291.8" width="423.0" height="48.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="318.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">You don't have to close the app.</text><text x="480.0" y="384.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Na dúvida, procure a palavra not logo depois de must: a frase proíbe.</text></svg>
