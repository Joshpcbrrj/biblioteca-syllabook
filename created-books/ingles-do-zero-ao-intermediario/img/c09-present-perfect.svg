<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img"><title>Passado simples x present perfect</title><desc>Com data definida, use o passado simples; sem data ou ainda em andamento, use have/has + particípio.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><line x1="50.0" y1="109.80000000000001" x2="50.0" y2="397.8" stroke="#B9B2A5" stroke-width="3"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Passado simples x present perfect</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><circle cx="50.0" cy="123.80000000000001" r="9.0" fill="#D3E2FF" stroke="#1F4E9C" stroke-width="2.5"/><text x="82.0" y="129.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1F4E9C">2022</text><text x="82.0" y="158.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#2B2B33">I started this job. (passado simples: momento definido)</text><circle cx="50.0" cy="200.8" r="9.0" fill="#D3E2FF" stroke="#1F4E9C" stroke-width="2.5"/><text x="82.0" y="206.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1F4E9C">2023</text><text x="82.0" y="235.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#2B2B33">I went to Canada in 2023. (passado simples)</text><circle cx="50.0" cy="277.8" r="9.0" fill="#E0D1F8" stroke="#4F2F8C" stroke-width="2.5"/><text x="82.0" y="283.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#4F2F8C">até hoje</text><text x="82.0" y="312.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#2B2B33">I've worked here for 3 years. (present perfect: ainda vale)</text><circle cx="50.0" cy="354.8" r="9.0" fill="#E0D1F8" stroke="#4F2F8C" stroke-width="2.5"/><text x="82.0" y="360.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#4F2F8C">sem data</text><text x="82.0" y="389.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#2B2B33">I've been to Canada. (present perfect: a experiência conta agora)</text><text x="480.0" y="452.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Com data definida, use o passado simples; sem data ou ainda em andamento, use have/has +</text><text x="480.0" y="473.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">particípio.</text></svg>
