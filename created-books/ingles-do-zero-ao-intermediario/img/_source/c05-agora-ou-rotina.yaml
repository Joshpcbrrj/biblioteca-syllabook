type: compare
title: "Rotina ou agora? O verbo muda junto"
left: {title: "Presente simples (rotina)", color: blue}
right: {title: "Presente contínuo (agora)", color: purple}
rows:
  - ["I work at a bank.", "I'm working on a report."]
  - ["She checks her e-mail every day.", "She's checking her e-mail now."]
