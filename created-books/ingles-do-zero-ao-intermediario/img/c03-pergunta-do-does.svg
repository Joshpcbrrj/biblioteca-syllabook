<svg xmlns="http://www.w3.org/2000/svg" width="960" height="743" viewBox="0 0 960 743" role="img"><title>Para perguntar, primeiro veja se o verbo é to be</title><desc>O Does já carrega o -s: o verbo principal volta à forma base.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Para perguntar, primeiro veja se o verbo é to be</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="113.80000000000001" width="537.6" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="109.80000000000001" width="537.6" height="54.0" rx="12" fill="#E4E0D6" stroke="#B9B2A5" stroke-width="2"/><text x="306.8" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2B2B33">Quero perguntar algo</text><line x1="306.8" y1="163.8" x2="306.8" y2="211.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><polygon points="306.8,211.8 516.464,250.8 306.8,289.8 97.136,250.8" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="253.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#6E4D00">O verbo é to be?</text><rect x="632.6" y="215.8" width="289.4" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="211.8" width="289.4" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="777.3" y="241.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">Inverta: Are you busy?</text><text x="777.3" y="267.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">to be + sujeito</text><line x1="516.464" y1="250.8" x2="632.6" y2="250.8" stroke="#17694A" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="574.532" y="244.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17694A">sim</text><line x1="306.8" y1="289.8" x2="306.8" y2="337.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="316.8" y="318.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">não</text><rect x="38" y="341.8" width="537.6" height="80.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="337.8" width="537.6" height="80.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="367.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#6E4D00">Use Do (I, you, we, they) ou Does (he, she,</text><text x="306.8" y="393.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#6E4D00">it)</text><line x1="306.8" y1="417.8" x2="306.8" y2="465.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="38" y="469.8" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="465.8" width="537.6" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><text x="306.8" y="495.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#1F4E9C">Sujeito + verbo na forma base</text><text x="306.8" y="521.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">Does she work here?</text><line x1="306.8" y1="543.8" x2="306.8" y2="591.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="38" y="595.8" width="537.6" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="591.8" width="537.6" height="54.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="306.8" y="621.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">Pergunta pronta</text><text x="480.0" y="699.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">O Does já carrega o -s: o verbo principal volta à forma base.</text></svg>
