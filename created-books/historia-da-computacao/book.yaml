chapters:
- n: 1
  title: 'Contar antes de computar: do ábaco às calculadoras mecânicas'
  goal: Montar uma linha do tempo de 5 marcos, do ábaco ao tear de Jacquard, e explicar a diferença entre
    calcular e computar
  topics:
  - ábaco e tabelas
  - Pascalina e Leibniz
  - aritmômetro
  - tear de Jacquard
  minutes: 40
  sources_original: []
- n: 2
  title: 'Babbage e Lovelace: a máquina que não ficou pronta'
  goal: Comparar a máquina diferencial e a analítica e avaliar, com fontes, o título de 'primeira programadora'
  topics:
  - máquina diferencial
  - máquina analítica
  - notas de Lovelace
  - lenda × registro
  minutes: 45
  sources_original: []
- n: 3
  title: Cartões, censos e computadores de carne e osso
  goal: Explicar como Hollerith acelerou o censo de 1890 e quem eram os 'computadores humanos'
  topics:
  - Hollerith e o censo
  - origem da IBM
  - computadoras humanas
  - analisador diferencial de Bush
  minutes: 45
  sources_original: []
- n: 4
  title: 'A ideia de máquina universal: Boole, Turing e Shannon'
  goal: Descrever com suas palavras o que uma máquina de Turing faz e por que o bit mudou tudo
  topics:
  - lógica de Boole
  - Turing 1936
  - Shannon e os circuitos
  - bit
  minutes: 50
  sources_original: []
- n: 5
  title: 'Guerra e válvulas: Zuse, Colossus e ENIAC'
  goal: Ordenar as primeiras máquinas eletrônicas e explicar a disputa sobre 'o primeiro computador'
  topics:
  - Zuse e o Z3
  - Atanasoff-Berry
  - Bletchley Park e Colossus
  - ENIAC e suas programadoras
  minutes: 50
  sources_original: []
- n: 6
  title: 'O programa vai para a memória: von Neumann e os primeiros computadores à venda'
  goal: Explicar o que é programa armazenado e por que ele permitiu a indústria de computadores
  topics:
  - EDVAC e o relatório de von Neumann
  - Manchester Baby
  - UNIVAC
  - IBM entra no jogo
  - 'Brasil: os primeiros computadores e o Zezinho do ITA (1961)'
  minutes: 45
  sources_original: []
- n: 7
  title: Do transistor ao chip
  goal: Ligar transistor, circuito integrado e microprocessador numa cadeia de causa e efeito até o barateamento
    dos computadores
  topics:
  - transistor (1947)
  - circuito integrado
  - System/360 e mainframes
  - Lei de Moore
  - Intel 4004
  - 'Brasil: o Patinho Feio da Poli-USP (1972), o G-10 e a Cobra'
  minutes: 50
  sources_original: []
- n: 8
  title: 'Ensinar a máquina a entender gente: o nascimento do software'
  goal: Explicar o que um compilador faz e reconhecer os marcos de FORTRAN, COBOL, Unix e da engenharia
    de software
  topics:
  - Grace Hopper e o A-0
  - FORTRAN e COBOL
  - o mito do primeiro 'bug'
  - Margaret Hamilton e a Apollo
  - Unix e C
  minutes: 50
  sources_original: []
- n: 9
  title: Um computador em cada mesa
  goal: Explicar por que o computador pessoal surgiu nos anos 1970 e quais ideias do Xerox PARC chegaram
    até nós
  topics:
  - Altair e os clubes
  - Apple II e IBM PC
  - Xerox PARC e a interface gráfica
  - Microsoft e o software vendido
  - 'Brasil: CAPRE, SEI e a reserva de mercado (Lei 7.232/1984)'
  minutes: 45
  sources_original: []
- n: 10
  title: 'Tudo conectado: ARPANET, web e celular'
  goal: Distinguir internet de web e traçar o caminho da ARPANET ao smartphone
  topics:
  - comutação de pacotes
  - ARPANET e TCP/IP
  - Berners-Lee e a web
  - busca e redes sociais
  - smartphone
  - 'Brasil: AlterNex, RNP, CGI.br e a internet comercial (1995)'
  minutes: 50
  sources_original: []
- n: 11
  title: 'Máquinas que aprendem: a longa estrada da inteligência artificial'
  goal: Contar as fases da IA, de Dartmouth aos grandes modelos de linguagem, e separar o que a IA atual
    faz do que se diz dela
  topics:
  - teste de Turing e Dartmouth
  - invernos da IA
  - Deep Blue e AlphaGo
  - aprendizado profundo
  - transformers e IA generativa
  minutes: 55
  sources_original: []
- n: 12
  title: 'Projeto final: seu museu da computação'
  goal: Montar uma linha do tempo comentada de 15 marcos, com uma causa por virada e um mito checado com
    fonte
  topics:
  - escolher marcos
  - causa e efeito
  - checar uma lenda
  - quem ficou de fora
  - pelo menos 2 marcos brasileiros
  minutes: 60
  sources_original: []
next_steps:
- title: Como um computador funciona por dentro
  why: Para entender na prática os bits, a lógica e a memória que este livro apresentou na história
  topics:
  - portas lógicas
  - binário
  - CPU e memória
- title: História da internet e da cultura digital
  why: Para aprofundar redes, web, redes sociais e seus efeitos na sociedade
  topics:
  - protocolos
  - web 2.0
  - privacidade
- title: IA para curiosos
  why: Para entender como funcionam e como usar com critério as IAs de hoje
  topics:
  - aprendizado de máquina
  - modelos de linguagem
  - limites e riscos
