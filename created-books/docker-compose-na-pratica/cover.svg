<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <!-- Ideia: três blocos (serviços) ligados por uma rede, sob um arquivo que os descreve. Acento: verde-azulado da trilha devops. -->
  <rect width="1600" height="2560" fill="#0f1b2d"/>
  <rect x="120" y="120" width="1360" height="12" fill="#2bb3a3"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="120" y="420" font-size="150" font-weight="700">Docker</text>
    <text x="120" y="590" font-size="150" font-weight="700">Compose</text>
    <text x="120" y="760" font-size="150" font-weight="700" fill="#2bb3a3">na prática</text>
    <text x="120" y="900" font-size="64" fill="#c9d4e3">Do primeiro compose.yaml</text>
    <text x="120" y="985" font-size="64" fill="#c9d4e3">a uma stack completa</text>
  </g>

  <!-- arquivo que descreve o projeto -->
  <g transform="translate(560,1180)">
    <path d="M0 0 H380 L480 100 V420 H0 Z" fill="none" stroke="#c9d4e3" stroke-width="14" stroke-linejoin="round"/>
    <path d="M380 0 V100 H480" fill="none" stroke="#c9d4e3" stroke-width="14" stroke-linejoin="round"/>
    <rect x="60" y="150" width="240" height="22" rx="11" fill="#2bb3a3"/>
    <rect x="110" y="220" width="280" height="22" rx="11" fill="#c9d4e3"/>
    <rect x="110" y="290" width="200" height="22" rx="11" fill="#c9d4e3"/>
  </g>

  <!-- rede ligando os serviços -->
  <g stroke="#2bb3a3" stroke-width="12" fill="none">
    <path d="M800 1600 V1760"/>
    <path d="M330 1760 H1270"/>
    <path d="M330 1760 V1860 M800 1760 V1860 M1270 1760 V1860"/>
  </g>

  <!-- três serviços -->
  <g fill="#1e3350" stroke="#2bb3a3" stroke-width="12">
    <rect x="160" y="1860" width="340" height="300" rx="28"/>
    <rect x="630" y="1860" width="340" height="300" rx="28"/>
    <rect x="1100" y="1860" width="340" height="300" rx="28"/>
  </g>
  <g fill="#c9d4e3">
    <rect x="220" y="1930" width="220" height="24" rx="12"/>
    <rect x="220" y="1990" width="160" height="24" rx="12"/>
    <rect x="690" y="1930" width="220" height="24" rx="12"/>
    <rect x="690" y="1990" width="160" height="24" rx="12"/>
    <rect x="1160" y="1930" width="220" height="24" rx="12"/>
    <rect x="1160" y="1990" width="160" height="24" rx="12"/>
  </g>

  <text x="120" y="2400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" fill="#ffffff">por Josué B. Almeida</text>
  <text x="1480" y="2400" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" fill="#c9d4e3">Edição 1.0</text>
</svg>
