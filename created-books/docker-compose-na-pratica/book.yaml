  what: Versão de referência passou de Docker Compose v5.6 / Engine 29.9 para Docker Compose v5.7.0 /
    Engine 29.9.3; saídas do capítulo 1 reexecutadas e a do docker compose up -d refeita
  why: São as versões instaladas na máquina do autor; a v5.8.0 ainda não chegou ao Docker Desktop (atualizar
    quando chegar, a pedido do autor)
- date: '2026-11-21'
  what: Capítulo 10 ganhou o tópico sync+exec
  why: Pedido do autor; o recurso existe desde o Compose 2.32.0 e está dentro da referência v5.7.0
- date: '2026-11-21'
  what: 'Ementa ampliada: o capítulo 9 ganhou command e entrypoint e docker compose cp; o capítulo 14
    ganhou build multi-stage com build.target (estágios dev e prod) e a publicação da imagem com image
    + build e docker compose push, testada num registro local (registry:2)'
  why: Pedido do autor, depois de comparar a ementa com um curso de Docker e um livro do tema; os três
    assuntos estão dentro da referência v5.7.0
- date: '2026-11-21'
  what: 'Edição 1.1. Capítulo 6: seção nova sobre publicar a porta presa a 127.0.0.1, com docker compose
    port e docker port mostrando a diferença (testado também pelo IP da rede local); o contador passa
    a usar "127.0.0.1:8000:8000" nos capítulos 6, 7, 8, 11, 12 e 13 (e o banco do override do capítulo
    11, "127.0.0.1:15432:5432"), com as saídas dos capítulos 11 e 13 reexecutadas. Capítulos 7 e 10: nota
