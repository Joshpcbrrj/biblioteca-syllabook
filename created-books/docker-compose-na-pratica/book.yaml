  - DNS por nome
  - ports vs rede interna
  - porta presa a 127.0.0.1
  minutes: 50
  sources_original: []
- n: 7
  title: Volumes no Compose
  goal: Declarar volume nomeado e entender a diferença entre down e down -v
  topics:
