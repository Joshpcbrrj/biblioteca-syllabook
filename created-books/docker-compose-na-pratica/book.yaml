progress:
- n: 1
  done: '2026-11-20'
  summary: 'Mostrou o problema do docker run longo (imperativo) e o compose.yaml como configuração declarativa.
    Ensinou serviço (receita) x contêiner (instância, nome <projeto>-<serviço>-<n>) e projeto (nome padrão
    = pasta, chave name, rede <projeto>_default). Exemplo: nginx:1.27-alpine em meu-site, porta 8080,
    volume ./site, TZ, restart. Exercícios: redis (cache), adminer, blog, painel com dois serviços; erros:
    no configuration file provided, No such container, port is already allocated.'
- n: 2
  done: '2026-11-20'
  summary: 'Ensinou o plugin do Compose (programa docker-compose que o docker acha em cli-plugins; erro
    ''docker: unknown command: docker compose'' quando falta). Docker Desktop já traz o Compose (About
    Docker Desktop); no Linux, pacote docker-compose-plugin (apt/yum), recomendado pelo docker-ce-cli,
    versão fixa 5.7.0-1~ubuntu.24.04~noble. docker compose version (--short) x docker version --format
    para o Engine; referência v5.7.0 / 29.9.3. Lab: Ubuntu 24.04 num contêiner, do erro à instalação.
    Erro comum: docker-compose com hífen (avulso, legado; existe no Desktop, não no servidor).'
- n: 3
  done: '2026-11-21'
  summary: 'Ensinou a estrutura do compose.yaml (services no topo, mapa, bloco aninhado, lista com ''-
    '', espaços e nunca Tab; erros reais: services.image must be a mapping, found character that cannot
    start any token, additional properties ''web'' not allowed, ports must be a array; version obsoleta)
    e o ciclo up (sem -d prende o terminal; Ctrl+C para sem remover) / up -d, ps (-a, --format), logs
    (-n, -f, nome do serviço, no such service) e down (remove contêineres e rede; arquivo, imagens e volumes
    ficam). Exemplos: meu-site com nginx 1.27.5, acesso a /nada com 404; cache com Redis.'
- n: 4
  done: '2026-11-21'
  summary: 'Ensinou a chave build: build: . (imagem <projeto>-<serviço>, ex. ola-api-api), image + build
    para nomear (pull access denied esperado antes do build), formato longo com context (relativo ao compose.yaml)
    e dockerfile (relativo ao contexto; erros failed to read dockerfile, unable to prepare context, api/api).
    up -d só constrói se a imagem não existe (Running, versão antiga); up -d --build reconstrói e recria
    (Recreate); docker compose build; down não remove imagens. Projeto: ola-api em Python (http.server,
    porta 8000, VERSAO 1→2); exercícios loja, vendas, estoque.'
- n: 5
  done: '2026-11-21'
  summary: 'Ensinou interpolação (${VAR}, ${VAR:-padrão}, ${VAR-padrão}, ${VAR:?msg}; aviso ''variable
    is not set. Defaulting to a blank string''), o .env ao lado do compose.yaml (prioridade: terminal
    > --env-file > .env; mudar valor + up -d recria sem --build), environment x env_file (environment
    vence; .env não chega sozinho ao contêiner) e docker compose config / --environment para conferir.
