<svg xmlns="http://www.w3.org/2000/svg" width="960" height="629" viewBox="0 0 960 629" role="img"><title>Um arquivo mudou: o que o watch faz?</title><desc>Da esquerda para a direita, cada ação é mais lenta e mais completa</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Um arquivo mudou: o que o watch faz?</text><text x="480.0" y="87.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">Cada regra do develop.watch escolhe uma ação para um caminho</text><rect x="364.8" y="105.4" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38.0" y="139.4" width="884.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38.0" y="135.4" width="884.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(52,149.4) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></g><text x="88.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">Arquivo salvo no editor</text><rect x="74.0" y="203.4" width="848.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="74.0" y="199.4" width="848.0" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(88,225.4) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g><text x="124.0" y="229.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#17694A">sync</text><text x="124.0" y="254.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">copia para o contêiner; nada reinicia</text><path d="M56.0,189.4 V238.4 H74.0" fill="none" stroke="#B9B2A5" stroke-width="2"/><rect x="74.0" y="291.4" width="848.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="74.0" y="287.4" width="848.0" height="78.0" rx="12" fill="#C6E9E9" stroke="#74C2C2" stroke-width="2"/><g transform="translate(88,313.4) scale(1.08333)" fill="none" stroke="#125B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></g><text x="124.0" y="317.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#125B5B">sync+exec</text><text x="124.0" y="342.59999999999997" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">copia e roda um comando, como nginx -s reload</text><path d="M56.0,189.4 V326.4 H74.0" fill="none" stroke="#B9B2A5" stroke-width="2"/><rect x="74.0" y="379.4" width="848.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="74.0" y="375.4" width="848.0" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(88,401.4) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g><text x="124.0" y="405.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#1F4E9C">sync+restart</text><text x="124.0" y="430.59999999999997" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">copia e reinicia o contêiner</text><path d="M56.0,189.4 V414.4 H74.0" fill="none" stroke="#B9B2A5" stroke-width="2"/><rect x="74.0" y="467.4" width="848.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="74.0" y="463.4" width="848.0" height="78.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(88,489.4) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></g><text x="124.0" y="493.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#6E4D00">rebuild</text><text x="124.0" y="518.5999999999999" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">reconstrói a imagem e recria o contêiner</text><path d="M56.0,189.4 V502.4 H74.0" fill="none" stroke="#B9B2A5" stroke-width="2"/><text x="480.0" y="586.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Da esquerda para a direita, cada ação é mais lenta e mais completa</text></svg>
