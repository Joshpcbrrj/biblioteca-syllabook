<svg xmlns="http://www.w3.org/2000/svg" width="960" height="511" viewBox="0 0 960 511" role="img"><title>Entrar no que roda ou criar um contêiner novo</title><desc>Para olhar ou consertar algo no que roda: exec. Para uma tarefa avulsa: run --rm</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Entrar no que roda ou criar um contêiner novo</text><text x="480.0" y="87.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">exec usa o contêiner do serviço; run cria um avulso a partir do mesmo serviço</text><rect x="364.8" y="105.4" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="139.4" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="135.4" width="423.0" height="54.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,149.4) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></g><text x="88.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1F4E9C">docker compose exec</text><rect x="499.0" y="139.4" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="135.4" width="423.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(513,149.4) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g><text x="549.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#4F2F8C">docker compose run</text><rect x="38" y="201.4" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="228.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Usa o contêiner que já roda</text><rect x="499.0" y="201.4" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="228.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Cria um contêiner novo</text><rect x="38" y="259.4" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="286.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Falha se o serviço estiver parado</text><rect x="499.0" y="259.4" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="286.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Sobe as dependências antes</text><rect x="38" y="317.4" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="344.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Vê os mesmos arquivos e processos</text><rect x="499.0" y="317.4" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="344.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Não publica as portas do serviço</text><rect x="38" y="375.4" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="402.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Nada para limpar depois</text><rect x="499.0" y="375.4" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="402.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Sem --rm, o contêiner fica</text><text x="480.0" y="468.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Para olhar ou consertar algo no que roda: exec. Para uma tarefa avulsa: run --rm</text></svg>
