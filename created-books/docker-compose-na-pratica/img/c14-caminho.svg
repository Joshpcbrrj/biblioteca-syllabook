<svg xmlns="http://www.w3.org/2000/svg" width="960" height="589" viewBox="0 0 960 589" role="img"><title>Um pedido atravessa a stack</title><desc>Em desenvolvimento, a porta do proxy é a 8080; em produção, a 80</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><line x1="811.5" y1="215.4" x2="811.5" y2="511.4" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><line x1="590.5" y1="215.4" x2="590.5" y2="511.4" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><line x1="369.5" y1="215.4" x2="369.5" y2="511.4" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><line x1="148.5" y1="215.4" x2="148.5" y2="511.4" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Um pedido atravessa a stack</text><text x="480.0" y="87.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">Só o proxy tem porta publicada; o resto conversa pela rede do projeto, pelo nome do serviço</text><rect x="364.8" y="105.4" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="44.0" y="139.4" width="209.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="44.0" y="135.4" width="209.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(58,149.4) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="94.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">navegador</text><rect x="265.0" y="139.4" width="209.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="265.0" y="135.4" width="209.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(279,149.4) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="315.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">proxy</text><rect x="486.0" y="139.4" width="209.0" height="80.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="486.0" y="135.4" width="209.0" height="80.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(500,162.4) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z"/><path d="M10 21.9V14L2.1 9.1"/><path d="m10 14 11.9-6.9"/><path d="M14 19.8v-8.1"/><path d="M18 17.5V9.4"/></g><text x="536.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">api</text><text x="536.0" y="191.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">(réplica)</text><rect x="707.0" y="139.4" width="209.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="707.0" y="135.4" width="209.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(721,149.4) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="757.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">db</text><text x="259.0" y="239.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">1. GET localhost:80</text><line x1="148.5" y1="247.4" x2="369.5" y2="247.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="480.0" y="283.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">2. proxy_pass http://api:8000</text><line x1="369.5" y1="291.4" x2="590.5" y2="291.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="701.0" y="327.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">3. INSERT em visitas (db:5432)</text><line x1="590.5" y1="335.4" x2="811.5" y2="335.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="701.0" y="371.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">4. id 7</text><line x1="811.5" y1="379.4" x2="590.5" y2="379.4" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/><text x="480.0" y="415.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">5. Visita número 7 (réplica ...)</text><line x1="590.5" y1="423.4" x2="369.5" y2="423.4" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/><text x="259.0" y="459.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">6. a mesma resposta</text><line x1="369.5" y1="467.4" x2="148.5" y2="467.4" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/><text x="480.0" y="546.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Em desenvolvimento, a porta do proxy é a 8080; em produção, a 80</text></svg>
