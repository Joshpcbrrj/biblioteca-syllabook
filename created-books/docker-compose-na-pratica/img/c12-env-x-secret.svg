<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img"><title>A mesma senha, dois caminhos</title><desc>Quem pode ler o arquivo db_senha.txt continua vendo a senha: proteja o arquivo e deixe-o fora do Git</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">A mesma senha, dois caminhos</text><text x="480.0" y="87.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">Como variável de ambiente ela aparece em toda parte; como secret, vira um arquivo</text><rect x="364.8" y="105.4" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="139.4" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="135.4" width="423.0" height="54.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(52,149.4) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="88.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#6E4D00">DB_SENHA em environment</text><rect x="499.0" y="139.4" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="135.4" width="423.0" height="54.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(513,149.4) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="549.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#17694A">secret db_senha</text><rect x="38" y="201.4" width="423.0" height="74.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="249.5" y="228.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">config: mostra a senha</text><rect x="499.0" y="201.4" width="423.0" height="74.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="228.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">config: mostra só o caminho do</text><text x="710.5" y="254.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">arquivo</text><rect x="38" y="285.4" width="423.0" height="48.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="249.5" y="312.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">docker inspect: senha em Env</text><rect x="499.0" y="285.4" width="423.0" height="48.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="312.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">docker inspect: só a montagem</text><rect x="38" y="343.4" width="423.0" height="48.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="249.5" y="370.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">printenv: mostra a senha</text><rect x="499.0" y="343.4" width="423.0" height="48.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="370.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">printenv: só DB_SENHA_FILE</text><rect x="38" y="401.4" width="423.0" height="48.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="249.5" y="428.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">O programa lê os.environ</text><rect x="499.0" y="401.4" width="423.0" height="48.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="710.5" y="428.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">O programa lê /run/secrets/db_senha</text><text x="480.0" y="494.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Quem pode ler o arquivo db_senha.txt continua vendo a senha: proteja o arquivo e deixe-o fora do</text><text x="480.0" y="515.1999999999999" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Git</text></svg>
