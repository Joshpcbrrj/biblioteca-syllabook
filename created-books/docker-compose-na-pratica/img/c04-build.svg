.0" y="316.59999999999997" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">a pasta indicada, com o app.py</text><line x1="306.8" y1="339.4" x2="306.8" y2="387.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="38" y="391.4" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="387.4" width="537.6" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,413.4) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></g><text x="88.0" y="417.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#1F4E9C">Segue o Dockerfile</text><text x="88.0" y="442.59999999999997" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">FROM, WORKDIR, COPY, CMD</text><line x1="306.8" y1="465.4" x2="306.8" y2="513.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><polygon points="306.8,513.4 516.464,552.4 306.8,591.4 97.136,552.4" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="555.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#6E4D00">Já existe a imagem?</text><g transform="translate(0,-23.4)"><rect x="632.6" y="517.4" width="289.4" height="124.80000000000001" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="513.4" width="289.4" height="124.80000000000001" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(646.6,562.8) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d=