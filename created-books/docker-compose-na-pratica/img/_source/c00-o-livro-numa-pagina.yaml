type: cards
title: "O livro numa página: do primeiro compose.yaml a uma stack completa"
cards:
  - icon: file-code
    number: "1-2"
    title: "O arquivo e a instalação"
    items:
      - "serviço = receita, contêiner = instância"
      - "docker compose version"
      - "plugin, não docker-compose"
  - icon: play
    number: "3-4"
    title: "Subir e construir"
    items:
      - "up -d, ps, logs, down"
      - "build: . e image + build"
      - "up -d --build recria"
  - icon: variable
    number: "5-6"
    title: "Variáveis e rede"
    items:
      - "${VAR:-padrão} e .env"
      - "o nome do serviço é o endereço"
      - "ports só para fora da rede"
  - icon: database
    number: "7-8"
    title: "Volumes e saúde"
    items:
      - "volume nomeado guarda o banco"
      - "down -v apaga os dados"
      - "service_healthy + --wait"
  - icon: terminal
    number: "9-10"
    title: "Dia a dia e watch"
    items:
      - "exec, run --rm, cp"
      - "restart não aplica mudança"
      - "develop.watch: sync e rebuild"
  - icon: layers
    number: "11-12"
    title: "Perfis e segredos"
    items:
      - "--profile e compose.override"
      - "-f soma listas, troca valores"
      - "secrets em /run/secrets"
  - icon: rocket
    number: "13-14"
    title: "Escala e projeto final"
    items:
      - "limits: cpus e memory"
      - "--scale api=3 atrás do proxy"
      - "base + override + prod"
