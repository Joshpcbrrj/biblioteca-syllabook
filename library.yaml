# Library settings. The skill fills these in the first time it sets up a
# library; you can change them at any time.
author: "Josué B. Almeida"       # goes on the cover and in the book metadata
repository: "Joshpcbrrj/biblioteca-syllabook"       # <owner>/<name> of this repository
branch: "main"
commit_name: "Josue"
commit_email: "joshpcbrrj@users.noreply.github.com"       # GitHub noreply address (<user>@users.noreply.github.com), never a personal one
default_language: "pt-BR"          # conversation and book language; "auto" = language of the first message
content_license: "CC BY-SA 4.0"
code_license: "MIT"
epub_release: "epubs"            # release tag that holds the EPUBs
notion_page: "https://app.notion.com/p/d7e93f537cfa49d6a160aeff28cccc5b"                  # Notion page where books are copied (the skill asks and fills it in)
