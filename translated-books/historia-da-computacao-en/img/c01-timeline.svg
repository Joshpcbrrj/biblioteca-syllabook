<svg xmlns="http://www.w3.org/2000/svg" width="960" height="586" viewBox="0 0 960 586" role="img"><title>Five milestones, from counting with pebbles to programming a loom</title><desc>Five milestones, from counting with pebbles to programming a loom</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><line x1="50.0" y1="143.60000000000002" x2="50.0" y2="508.6" stroke="#B9B2A5" stroke-width="3"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-w