<svg xmlns="http://www.w3.org/2000/svg" width="960" height="768" viewBox="0 0 960 768" role="img"><title>From the census form to the number on the dial</title><desc>From the census form to the number on the dial</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">From the census form to the number on the dial</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="96.0" y="113.80000000000001" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="109.80000000000001" width="768.0" height="78.0" rx="12" fill="#E4E0D6" stroke="#B9B2A5" stroke-width="2"/><text x="480.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2B2B33">Enumerator records the answers</text><text x="480.0" y="165.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">paper, house by house</text><line x1="480.0" y1="187.8" x2="480.0" y2="235.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="239.8" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="235.8" width="768.0" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><text x="480.0" y="265.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#1F4E9C">Clerk punches the card</text><text x="480.0" y="291.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">pantograph: ~500 cards a day</text><line x1="480.0" y1="313.8" x2="480.0" y2="361.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="365.8" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="361.8" width="768.0" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><text x="480.0" y="391.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#1F4E9C">Two-plate reader closes on the card</text><text x="480.0" y="417.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">pins pass through the holes</text><line x1="480.0" y1="439.8" x2="480.0" y2="487.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="491.8" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="487.8" width="768.0" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><text x="480.0" y="517.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#1F4E9C">Pins touch mercury and close a circuit</text><text x="480.0" y="543.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">only where there is a hole</text><line x1="480.0" y1="565.8" x2="480.0" y2="613.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="617.8" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="613.8" width="768.0" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="480.0" y="643.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">The dial advances one unit</text><text x="480.0" y="669.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">40 dials on the 1890 tabulator</text></svg>
