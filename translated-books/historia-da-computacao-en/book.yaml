chapters:
- n: 1
  title: 'Counting before computing: from the abacus to mechanical calculators'
  goal: Build a timeline of 5 milestones, from the abacus to the Jacquard loom, and explain the difference
    between calculating and computing
  topics:
  - the abacus and tables
  - Pascal and Leibniz
  - the arithmometer
  - the Jacquard loom
  minutes: 40
  sources_original: []
- n: 2
  title: 'Babbage and Lovelace: the machine that was never finished'
  goal: Compare the Difference Engine and the Analytical Engine and assess, with sources, the title of
    'first programmer'
  topics:
  - the Difference Engine
  - the Analytical Engine
  - Lovelace's Notes
  - legend vs. record
  minutes: 45
  sources_original: []
- n: 3
  title: Cards, censuses and flesh-and-blood computers
  goal: Explain how Hollerith sped up the 1890 census and who the 'human computers' were
  topics:
  - Hollerith and the census
  - the origins of IBM
  - human computers
  - Bush's differential analyzer
  minutes: 45
  sources_original: []
- n: 4
  title: 'The idea of a universal machine: Boole, Turing and Shannon'
  goal: Describe in your own words what a Turing machine does and why the bit changed everything
  topics:
  - Boole's logic
  - Turing, 1936
  - Shannon and circuits
  - the bit
  minutes: 50
  sources_original: []
- n: 5
  title: 'War and vacuum tubes: Zuse, Colossus and ENIAC'
  goal: Put the first electronic machines in order and explain the dispute over 'the first computer'
  topics:
  - Zuse and the Z3
  - Atanasoff-Berry
  - Bletchley Park and Colossus
  - ENIAC and its programmers
  minutes: 50
  sources_original: []
- n: 6
  title: 'The program moves into memory: von Neumann and the first computers for sale'
  goal: Explain what a stored program is and why it made the computer industry possible
  topics:
  - EDVAC and von Neumann's report
  - the Manchester Baby
  - UNIVAC
  - IBM enters the game
  - 'Brazil: the first computers and ITA''s Zezinho (1961)'
  minutes: 45
  sources_original: []
- n: 7
  title: From the transistor to the chip
  goal: Link the transistor, the integrated circuit and the microprocessor in a chain of cause and effect
    down to cheaper computers
  topics:
  - the transistor (1947)
  - the integrated circuit
  - System/360 and mainframes
  - Moore's law
  - the Intel 4004
  - 'Brazil: Poli-USP''s Patinho Feio (1972), the G-10 and Cobra'
  minutes: 50
  sources_original: []
- n: 8
  title: 'Teaching the machine to understand people: the birth of software'
  goal: Explain what a compiler does and recognize the milestones of FORTRAN, COBOL, Unix and software
    engineering
  topics:
  - Grace Hopper and the A-0
  - FORTRAN and COBOL
  - the myth of the first 'bug'
  - Margaret Hamilton and Apollo
  - Unix and C
  minutes: 50
  sources_original: []
- n: 9
  title: A computer on every desk
  goal: Explain why the personal computer appeared in the 1970s and which Xerox PARC ideas reached us
  topics:
  - the Altair and the clubs
  - the Apple II and the IBM PC
  - Xerox PARC and the graphical interface
  - Microsoft and software for sale
  - 'Brazil: Law 7,232/1984 and the market reserve'
  minutes: 45
  sources_original: []
- n: 10
  title: 'Everything connected: ARPANET, the web and the phone'
  goal: Tell the internet from the web and trace the path from ARPANET to the smartphone
  topics:
  - packet switching
  - ARPANET and TCP/IP
  - Berners-Lee and the web
  - search and social networks
  - the smartphone
  - 'Brazil: AlterNex, RNP, CGI.br and the commercial internet (1995)'
  minutes: 50
  sources_original: []
- n: 11
  title: 'Machines that learn: the long road of artificial intelligence'
  goal: Tell the phases of AI, from Dartmouth to large language models, and separate what today's AI does
    from what is said about it
  topics:
  - the Turing test and Dartmouth
  - AI winters
  - Deep Blue and AlphaGo
  - deep learning
  - transformers and generative AI
  minutes: 55
  sources_original: []
- n: 12
  title: 'Final project: your museum of computing'
  goal: Build an annotated timeline of 15 milestones, with one cause per turning point and one myth checked
    against a source
  topics:
  - choosing milestones
  - cause and effect
  - checking a legend
  - who was left out
  - at least 2 milestones from outside the US and the UK
  minutes: 60
  sources_original: []
next_steps:
- title: How a computer works inside
  why: To understand in practice the bits, logic and memory this book introduced through history
  topics:
  - logic gates
  - binary
  - CPU and memory
- title: History of the internet and digital culture
  why: To go deeper into networks, the web, social networks and their effects on society
  topics:
  - protocols
  - web 2.0
  - privacy
- title: AI for the curious
  why: To understand how today's AIs work and how to use them with judgment
  topics:
  - machine learning
  - language models
  - limits and risks
