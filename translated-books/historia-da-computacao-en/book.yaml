progress:
- n: 1
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: abacus/Salamis tablet, Pascaline and carry, Leibniz stepped drum, arithmometer (1820),
    Jacquard loom; calculating vs. computing (working definitions); fact vs. interpretation boxes; recipe
    analogy (kitchen = machine, cards = recipe). Translation of ch. 1, no code.'
- n: 2
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: Difference Engine (finite differences, only additions; Python run, output 41..83),
    Analytical Engine (Store/Mill, cards, decimal, never built), Lovelace''s Notes and Note G, fact vs.
    interpretation vs. legend on ''first programmer'', source analysis (CHM vs. Prospect, incl. Prospect''s
    wrong debugging claim). Recipe analogy used three times.'
- n: 3
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: 1890 census and Hollerith (punched data card, pantograph, tabulating machine with
    pins and mercury), instructions vs. data on cards, human computers and Langley (NASA), Bush''s differential
    analyzer, analog vs. digital. Own arithmetic: 8,571 operator days vs. 120,000 clerk days.'
- n: 4
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: Boole''s logic (AND, OR, NOT as 0/1 arithmetic, truth table run), Turing machine (tape,
    head, state table; binary +1 machine run, 1011 to 1100 in 8 steps), universal machine, Shannon''s
    circuits (half adder run), the bit (log2). Recipe analogy; fact vs. interpretation on dates (thesis
    1940 per MIT).'
- n: 5
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: relay vs. vacuum tube, Zuse''s Z3 (1941), ABC and the 1973 patent ruling, Bletchley
    Park Bombe and Colossus (secret until 1970s), ENIAC and its six programmers (wires and switches),
    why ''first computer'' depends on the definition (sorted-by-year code run).'
- n: 6
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: stored program (von Neumann 1945; minimal LOAD/ADD/STORE/HALT machine run: 42, 40),
    Manchester Baby 1948 and EDSAC 1949, UNIVAC 1951 (46 units), IBM name 1924, Zezinho (ITA, 1961, did
    not run computations). Recipe analogy; fact vs. interpretation on ''first''.'
- n: 7
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: transistor (Bardeen/Brattain, Bell Labs, Dec 1947; TX-0 1956), integrated circuit
    (Kilby 1958, Noyce 1959), System/360 (Apr 7, 1964, five models, compatibility; PDP-8 US$18,000 = 1/5
    of small 360 = US$90,000), Moore''s law (1965 doubling/12 months, 1975 revised to 2 years; self-fulfilling
    prophecy; Python projection from 2,250 transistors), Intel 4004 (1971, Busicom), Patinho Feio (Poli-USP
    1972, G-10, Cobra MC 500). Part-3 summary sheet drawn.'
- n: 8
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: compiler (Hopper A-0 1952; minimal Python compiler LOAD/ADD/STORE/HALT run: 42), FORTRAN
    1957 (Backus/IBM), COBOL 1960 (FLOW-MATIC; Hopper''s role not stated), the 1947 moth vs. older word
    ''bug'' (Edison 1878, 1889, ''debug'' 1945), Margaret Hamilton/Apollo (not claimed to coin ''software
    engineering''), Atlas 1962, Unix 1969, C 1972. Recipe analogy: translator, kitchen manager.'
- n: 9
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: personal computer (Altair 8800, Jan 1975, US$297 kit/US$395 case, BASIC licensed to
    MITS), Xerox Alto 1974 and the GUI, Apple II 1977, IBM PC 1981, Macintosh 1984 (US$2,500; price table
    run: Mac/C64 = 4.2), software as a product, Law 7,232/1984 (arts. 2, 9, 11, 1/8, 4 VIII, 45; ''market
    reserve'' not in the text, CAPRE absent), Ripper 2004 testimony, Law 8,248/1991. Quotes from PT sources
    marked as my translation.'
- n: 10
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: packet switching (numbered packets, out-of-order arrival; Python run), ARPANET 1969
    and TCP/IP on 1 Jan 1983, internet vs. web (Berners-Lee 1989, CERN release 1991), iPhone 2007 (price
    ~24% of Macintosh), Brazil: AlterNex 1989, RNP, CGI.br 1995, hosts 1996 (run). Recipe analogy; fact
    vs. interpretation boxes.'
- n: 11
  done: '2026-11-28'
  reread: '2026-11-28'
  summary: 'Taught: Turing test (SEP) and Dartmouth proposal 1955, Samuel checkers and Lighthill report
