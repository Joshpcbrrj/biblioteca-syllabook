<svg xmlns="http://www.w3.org/2000/svg" width="960" height="573" viewBox="0 0 960 573" role="img"><title>A aparência do terminal tem quatro camadas, e duas moram no Windows e duas no Ubuntu</title><desc>Azul: no Windows. Verde: no Ubuntu. Laranja: um pouco de cada lado.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">A aparência do terminal tem quatro camadas, e duas moram no</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Windows e duas no Ubuntu</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="147.60000000000002" width="884" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="143.60000000000002" width="884" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,169.6) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="88.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1F4E9C">1. Janela e cores</text><text x="88.0" y="198.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">Windows Terminal: perfil e esquema (Windows)</text><rect x="38" y="235.60000000000002" width="884" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="231.60000000000002" width="884" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,257.6) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="88.0" y="261.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1F4E9C">2. Fonte</text><text x="88.0" y="286.8" font-family="system-ui, 