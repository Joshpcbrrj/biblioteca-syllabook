<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" role="img"><title>Volume: o Docker guarda e cuida. Bind mount: você escolhe a pasta do seu computador</title><desc>Um terceiro tipo, o tmpfs (só no Linux), guarda dados na memória e os descarta ao parar o contêiner.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Volume: o Docker guarda e cuida. Bind mount: você escolhe a</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">pasta do seu computador</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="147.60000000000002" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="143.60000000000002" width="423.0" height="54.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(52,157.6) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="88.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#17694A">Volume nomeado</text><rect x="499.0" y="147.60000000000002" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="143.60000000000002" width="423.0" height="54.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(513,157.6) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></g><text x="549.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1F4E9C">Bind mount</text><rect x="38" y="209.60000000000002" width="423.0" height="74.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="249.5" y="236.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Fica numa área do Docker</text><rect x="499.0" y="209.60000000000002" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="710.5" y="236.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">É uma pasta que você escolhe no</text><text x="710.5" y="262.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">host</text><rect x="38" y="293.6" width="423.0" height="74.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="249.5" y="320.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Você o cria e o remove pelo nome</text><rect x="499.0" y="293.6" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="710.5" y="320.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Você mexe nos arquivos com o seu</text><text x="710.5" y="346.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">editor</text><rect x="38" y="377.6" width="423.0" height="74.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="249.5" y="404.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Mesmo comando em Windows, Mac e</text><text x="249.5" y="430.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Linux</text><rect x="499.0" y="377.6" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="710.5" y="404.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">O caminho muda de sistema para</text><text x="710.5" y="430.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">sistema</text><rect x="38" y="461.6" width="423.0" height="74.0" rx="10" fill="#E4F6EC" stroke="#6FC39C" stroke-width="2"/><text x="249.5" y="488.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Uso típico: banco de dados</text><rect x="499.0" y="461.6" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="710.5" y="488.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Uso típico: código em</text><text x="710.5" y="514.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">desenvolvimento</text><text x="480.0" y="580.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Um terceiro tipo, o tmpfs (só no Linux), guarda dados na memória e os descarta ao parar o</text><text x="480.0" y="601.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">contêiner.</text></svg>
