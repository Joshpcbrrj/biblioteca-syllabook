<svg xmlns="http://www.w3.org/2000/svg" width="960" height="696" viewBox="0 0 960 696" role="img"><title>No multi-stage, o compilador fica no estágio 1 e só os pacotes prontos chegam à imagem</title><desc>O estágio 1 não vai para a imagem final: ele só existe durante o build.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">No multi-stage, o compilador fica no estágio 1 e só os</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">pacotes prontos chegam à imagem</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="96.0" y="147.60000000000002" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="143.60000000000002" width="768.0" height="78.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(110,169.6) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g><text x="146.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#6E4D00">Estágio 1: build</text><text x="146.0" y="198.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">gcc, libpq-dev e pip install --prefix=/install</text><line x1="480.0" y1="221.60000000000002" x2="480.0" y2="269.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="273.6" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="269.6" width="768.0" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(110,295.6) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g><text x="146.0" y="299.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#1F4E9C">COPY --from=build /install /usr/local</text><text x="146.0" y="324.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">só a pasta dos pacotes prontos atravessa</text><line x1="480.0" y1="347.6" x2="480.0" y2="395.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="399.6" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="395.6" width="768.0" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(110,421.6) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="146.0" y="425.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#17694A">Estágio 2: final</text><text x="146.0" y="450.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">libpq5, os pacotes e o app.py; sem compilador</text><line x1="480.0" y1="473.6" x2="480.0" y2="521.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="525.6" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="521.6" width="768.0" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(110,547.6) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g><text x="146.0" y="551.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#17694A">Imagem de 197 MB</text><text x="146.0" y="576.8000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">contra 511 MB com tudo num estágio só</text><text x="480.0" y="653.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">O estágio 1 não vai para a imagem final: ele só existe durante o build.</text></svg>
