<svg xmlns="http://www.w3.org/2000/svg" width="960" height="557" viewBox="0 0 960 557" role="img"><title>stop pede com educação e espera; kill derruba na hora</title><desc>docker kill pula a espera e envia SIGKILL de uma vez (padrão), sem chance de o programa salvar nada.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">stop pede com educação e espera; kill derruba na hora</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="113.80000000000001" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="109.80000000000001" width="537.6" height="78.0" rx="12" fill="#E4E0D6" stroke="#B9B2A5" stroke-width="2"/><g transform="translate(52,135.8) scale(1.08333)" fill="none" stroke="#45454F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></g><text x="88.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2B2B33">docker stop</text><text x="88.0" y="165.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">envia SIGTERM ao processo principal (PID 1)</text><line x1="306.8" y1="187.8" x2="306.8" y2="235.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><polygon points="306.8,235.8 516.464,272.2 306.8,308.6 97.136,272.2" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="274.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6E4D00">Ele encerrou dentro do prazo?</text><g transform="translate(0,-2.6)"><rect x="632.6" y="239.8" width="289.4" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="235.8" width="289.4" height="78.0" rx="12" fill="#FFD3C5" stroke="#EE9478" stroke-width="2"/><text x="777.3" y="265.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#963019">Envia SIGKILL: exit 137</text><text x="777.3" y="291.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">depois do prazo (-t)</text></g><line x1="516.464" y1="272.2" x2="632.6" y2="272.2" stroke="#963019" stroke-width="2.5" marker-end="url(#arrow-red)"/><text x="574.532" y="266.2" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#963019">não</text><line x1="306.8" y1="313.8" x2="306.8" y2="361.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="316.8" y="342.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">sim</text><rect x="38" y="365.8" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="361.8" width="537.6" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(52,387.8) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g><text x="88.0" y="391.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#17694A">Saída limpa</text><text x="88.0" y="417.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">exit 0 (ou 143 quando morre pelo sinal)</text><text x="480.0" y="493.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">docker kill pula a espera e envia SIGKILL de uma vez (padrão), sem chance de o programa salvar</text><text x="480.0" y="514.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">nada.</text></svg>
