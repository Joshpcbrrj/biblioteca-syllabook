iner nasce, roda, para e só some quando você o</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">remove</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="96.0" y="147.60000000000002" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="143.60000000000002" width="768.0" height="78.0" rx="12" fill="#E4E0D6" stroke="#B9B2A5" stroke-width="2"/><g transform="translate(110,169.6) scale(1.08333)" fill="none" stroke="#45454F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g><text x="146.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2B2B33">created</text><text x="146.0" y="198.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">docker create: existe, não roda</text><line x1="480.0" y1="221.60000000000002" x2="480.0" y2="269.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="96.0" y="273.6" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="269.6" width="768.0" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(110,295.6) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g><text x="146.0" y="299.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#17694A">running</text><text x="146.0" y="