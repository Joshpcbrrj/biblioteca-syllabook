progress:
- n: 1
  done: '2026-11-26'
  summary: 'Ensinou o problema ''na minha máquina funciona'', contêiner × VM (kernel compartilhado, provado
    com uname -r em Alpine e Debian), imagem × contêiner, namespaces/cgroups, as peças CLI/Engine/containerd/runc/Desktop
    e quando não usar contêineres. Analogia única: a cozinha compartilhada (receita = imagem, cozinha
    = contêiner, rede de gás e luz = kernel). Projeto: página ''Tarefas v0'' servida por python:3.14-slim
    com -p 127.0.0.1:8080:8000; nomes dz-*. Aviso do Git Bash (MSYS_NO_PATHCONV=1).'
- n: 2
  done: '2026-11-26'
  summary: 'Requisitos do Windows (WSL 2.1.5+, build 22631+, 8 GB), três backends (WSL 2, Hyper-V, Docker
    VMM Beta), ligar o WSL (wsl --install, dism, janela), instalar por usuário ou para todos, flags --accept-license
    e --backend=wsl-2, winget, integração com distros, problemas comuns. Executado: wsl --version/-l -v,
    sc query, hello-world no Windows e no Ubuntu do WSL; instalação NÃO executada (Docker já instalado).
    Aviso sobre VirtualizationFirmwareEnabled=False com hipervisor ativo e sobre o problema do Desktop
    4.100.x com containerd. Pendente: capturas reais do instalador e do Gerenciador de Tarefas.'
- n: 3
  done: '2026-11-26'
  summary: 'Engine × Desktop para Linux; instalação do Engine no Ubuntu pelo repositório apt (remover
    conflitantes, chave GPG, docker.sources deb822, pacotes docker-ce); grupo docker e socket (equivale
    a root), newgrp, ufw não bloqueia portas publicadas; Engine no Ubuntu do WSL (systemd=true, não misturar
    com a integração); Docker Desktop no Mac (não executado). Executado num ubuntu:26.04 descartável com
    a usuária ana: repositório, policy (Engine 29.10.1, plugin compose 5.8.0), usermod. systemctl, hello-world
    e Mac NÃO executados. Analogia única: chave do portão (grupo docker).'
- n: 4
  done: '2026-11-26'
  summary: Anatomia do docker run (opções antes da imagem, -p host:contêiner, -d, --rm, -i/-t, --label);
    estados created/running/paused/exited; ps -a, --filter, --format, -s, stats; stop × kill com SIGTERM/SIGKILL,
    PID 1, códigos 0/143/137, --init, -t; start/restart rodam o comando de novo (mkdir -p); rm, rm -f,
    prune com --filter label; logs (--tail, --since, -t, -f); exec (-it não executado, sem terminal);
    inspect --format (IP em .NetworkSettings.Networks no Engine 29). Servidor dz-web em 127.0.0.1:8080
    com etiqueta dz=livro. Prazo do stop medido ~3,5 s, não 10 s.
- n: 5
  done: '2026-11-26'
  summary: Janela (Dashboard) e CLI são clientes do mesmo Engine; docker desktop status/stop/restart (stop
    derruba tudo, não executado); menu lateral, configurações (General, Resources/WSL integration), aviso
    4.100.0/4.100.1 (containerd); aba Containers e abas Logs/Inspect/Exec/Files/Stats/Debug com equivalentes
    (docker cp executado); quando usar cada um; contextos (ls, show, use, --context, DOCKER_CONTEXT, create/rm
    executados; default e desktop-linux chegam ao mesmo motor nesta máquina); licença do Desktop. Passos
    pela janela não executados (sem capturas). Mesmo servidor dz-web 127.0.0.1:8080.
- n: 6
  done: '2026-11-26'
  summary: 'Imagem = camadas somente leitura + config (docker history/inspect de python:3.14-slim: 4 camadas,
    Debian trixie 87,7 MB, Python 3.14.10); analogia da biblioteca de receitas (tag = lombada, digest
    = código do miolo); nome completo registro/namespace/repositório:tag; tag × digest (IMAGE ID = começo
    do digest no containerd; DISK USAGE 180 MB × CONTENT SIZE 45,7 MB); categorias de confiança do Hub
    e limite de pull sem login (100/6 h); pull, images --filter reference, tag, rmi (Untagged × Deleted,
    conflito com contêiner parado); dangling via commit e prune filtrado por label; multi-arquitetura
    (imagetools); save/load. Alpine 73,9 MB × slim 180 MB. Executado tudo; imagens baixadas removidas.'
- n: 7
  done: '2026-11-26'
  summary: 'API de tarefas (Python stdlib, /saude, /tarefas GET/POST, dados em memória, ENDERECO/PORTA/APP_VERSAO
    por env, trata SIGTERM); Dockerfile (FROM, RUN useradd, WORKDIR, COPY, ARG+ENV APP_VERSAO, ENV PORTA,
    USER app, EXPOSE, CMD exec); docker build -t dz-api:1.0 . (ponto = contexto); EXPOSE só documenta;
    CMD × ENTRYPOINT (dz-eco); forma exec × shell (docker top, stop 3,5 s/137); contexto e .dockerignore
    (31,47 MB × 94 B; imagem 210 × 178 MB; BuildKit só transfere o que o COPY pede); ARG × ENV (ARG aparece
    no docker history); boas práticas (versão fixa, exec, não-root, sem segredos, SIGTERM). Arquivos do
    projeto em ~/api-livro: app.py, Dockerfile, .dockerignore. Imagem dz-api:1.0 178 MB; tudo executado.'
changes: []
handoff:
- 'Pedir ao usuário 3 capturas reais (img/CREDITS.md): cap. 2 página Configuration do instalador (opção
  Use WSL 2) e Gerenciador de Tarefas > Desempenho > CPU (Virtualização); cap. 5 aba Containers do Docker
  Desktop 4.99 e Settings > Resources > WSL integration. Nenhuma captura real foi inserida nos caps. 1
  a 3.'
- 'Cap. 4: o docker stop de PID 1 sem tratador levou ~3,5 s (exit 137) nesta máquina, não 10 s; a doc
  não cita o prazo padrão: medir de novo e não afirmar 10 s sem fonte.'
- 'Pesquisa em aberto: página atual do host.docker.internal (a URL de networking do Desktop deu 404),
  pacote/versão do psycopg para a API 1.1 (cap. 12) e registry:3 para o push local (cap. 11).'
- 'Segurança do laboratório: esta máquina tem contêineres e imagens do autor (cariockko-*, portas 3000/3001,
  localhost:5000/stack-api): usar só nomes dz-*, nunca prune/rm em massa; ubuntu:26.04, alpine:3.23 e
  python:3.14-slim já baixadas. Usar sempre MSYS_NO_PATHCONV=1 no Git Bash.'
- 'Próximo passo: book.py brief 4 (caps. 4 a 12 e partes fixas: cap. 0, teste de nivelamento, simulado,
  glossário, cheat sheets, próximos caminhos); ler references/BOOK.md antes das partes fixas e ler o original
  de cada capítulo só nas seções do brief.'
