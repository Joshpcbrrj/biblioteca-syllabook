chapters:
- n: 1
  title: Por que controlar versões
  goal: Explicar o que é controle de versão, o que o Git faz e por que Git não é GitHub
  topics:
  - o problema do projeto_final_v3_agora_vai
  - centralizado × distribuído
  - Git × GitHub e outros serviços
  minutes: 30
  sources_original:
  - O que é controle de versão
  - O que é o Git
  - Git não é GitHub
- n: 2
  title: Instalação, identidade e credenciais
  goal: Instalar e configurar o Git e autenticar no GitHub sem senha
  topics:
  - instalar no Windows, macOS e Linux
  - 'git config: system, global e local'
  - identidade × credenciais
  - Git Credential Manager e SSH
  minutes: 45
  sources_original:
  - Instalando e configurando o Git
  - Registrando usuários locais e credenciais
- n: 3
  title: Como o Git pensa
  goal: Prever o estado de cada arquivo entre as três áreas do Git
  topics:
  - snapshots e hashes
  - as três áreas
  - untracked, modified, staged, committed
  - .gitignore
  minutes: 45
  sources_original:
  - Entendendo como o Git funciona
  - O ciclo de vida dos status de arquivos no Git
  - Fazendo uso do .gitignore
- n: 4
  title: Commits e histórico
  goal: Criar commits pequenos e bem descritos e encontrar qualquer mudança no histórico
  topics:
  - git add e git commit
  - mensagens de commit
  - git log e seus filtros
  - git show, git diff, git blame
  - HEAD e HEAD~n
  minutes: 50
  sources_original:
  - Como fazer os commits
  - Como consultar o histórico do projeto
  - Conhecendo alguns comandos úteis
  - Consultando histórico de commits
- n: 5
  title: Desfazendo erros com segurança
  goal: Escolher o comando certo para desfazer cada tipo de erro e recuperar o que parecia perdido
  topics:
  - restore
  - commit --amend
  - checkout de um commit e detached HEAD
  - reset --soft/--mixed/--hard
  - revert
  - reflog
  minutes: 60
  sources_original:
  - Voltando no tempo com o Git
  - Desfazendo e refazendo ações no Git
  - Desfazendo ações com checkout
  - Desfazendo ações com revert e reset
- n: 6
  title: Branches, stash e merge
  goal: Desenvolver em paralelo com branches, guardar trabalho com stash e integrar resolvendo conflitos
  topics:
  - branch como ponteiro
  - git switch
  - stash
  - fast-forward × merge de três vias
  - resolver conflitos
  minutes: 60
  sources_original:
  - Branches
  - Guardando trabalho com git stash
  - Merge
  - Resolvendo conflitos
- n: 7
  title: Rebase e histórico limpo
  goal: Atualizar uma branch com rebase e arrumar commits locais com rebase interativo
  topics:
  - rebase × merge
  - regra de ouro
  - conflitos no rebase
  - 'rebase -i: reword, squash, fixup, drop'
  minutes: 45
  sources_original:
  - Rebase
- n: 8
  title: Repositórios remotos
  goal: Sincronizar um repositório local com um remoto e marcar versões com tags
  topics:
  - bare repository como remoto de treino
  - clone e push
  - fetch × pull
  - branches de rastreamento
  - criar o repositório no GitHub
  - tags e releases
  minutes: 60
  sources_original:
  - Bare repository
  - Clone e push
  - Fetch e pull
  - Repositório remoto no GitHub
  - Usando Clone e pull
  - Trabalhando com tags
- n: 9
  title: Colaborando no GitHub
  goal: Trabalhar em equipe e contribuir com projetos open source por issue, fork e pull request
  topics:
  - colaboradores
  - issues
  - fork e upstream
  - pull request e revisão
  - GitHub Flow e Git Flow
  minutes: 60
  sources_original:
  - Adicionando colaboradores no meu projeto
  - O que são issues
  - Trabalhando com fork
  - Realizando e aceitando pull requests
  - 'Fluxos de trabalho em equipe: GitHub Flow e Git Flow'
- n: 10
  title: 'Projeto: currículo online'
  goal: Publicar um currículo com GitHub Pages, documentado com README em Markdown, e compartilhar trechos
    com gists
  topics:
  - Markdown
  - README
  - GitHub Pages
  - Git no VS Code
  - gists
  minutes: 60
  sources_original:
  - 'Projeto: currículo online com GitHub Pages + plugins do Git para VS Code'
  - Entendendo o markdown
  - Entendendo gists
