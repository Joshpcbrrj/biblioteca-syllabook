progress:
- n: 1
  done: '2026-11-21'
  summary: 'Problema das cópias ''final'' (cardápio da lanchonete) resolvido pelo histórico: commit, autor,
    data, mensagem, diff lido de um git log real (commits ce3dc3c, cf762e2, 4df55bb). Centralizado (SVN,
    CVS) × distribuído (Git, Mercurial): onde fica o histórico; origem do Git em 2005 (BitKeeper). Git
    (programa local) × GitHub (serviço que hospeda; GitLab, Bitbucket), com captura da página de commits
    do git/git. Prática só de leitura de histórico; sem terminal.'
- n: 2
  done: '2026-11-21'
  summary: 'Instalação (Windows instalador com Git Bash e GCM, macOS brew, Debian apt-get; Git 2.56, mínimo
    2.23). git config em três níveis (system, global, local; o mais próximo vence), --show-origin, --get-all,
    --unset; identidade user.name/email (Ana Ribeiro, horta comunitária), init.defaultBranch main, core.editor
    ''code --wait''. Identidade × credencial; senha recusada desde 13/08/2021; GCM (manager), helpers
    cache/store/osxkeychain; SSH ed25519 com analogia do cartão de assinatura do banco. Lab: deixar o
    Git pronto.'
- n: 3
  done: '2026-11-21'
  summary: 'Nasce o projeto receitas (index.html, receitas/bolo-de-cenoura.md): git init e a pasta .git;
    commit por dentro com git cat-file (tree, blob, hash, pai), snapshot que reaproveita o blob do index.html
    (9a16b95 → 9b3de16). Três áreas com a analogia do álbum de fotos (mesa = staging area). Estados untracked/staged/unmodified/modified;
    git status -s com duas colunas; o caso MM. .gitignore (.env, *.log, rascunhos/* com exceção !publicar.md;
    a armadilha rascunhos/), git check-ignore -v, --ignored, git rm --cached e o aviso de segredo já commitado.
    4 commits no lab.'
