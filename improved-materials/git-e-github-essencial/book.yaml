progress:
- n: 1
  done: '2026-11-21'
  summary: 'Problema das cópias ''final'' (cardápio da lanchonete) resolvido pelo histórico: commit, autor,
    data, mensagem, diff lido de um git log real (commits ce3dc3c, cf762e2, 4df55bb). Centralizado (SVN,
    CVS) × distribuído (Git, Mercurial): onde fica o histórico; origem do Git em 2005 (BitKeeper). Git
    (programa local) × GitHub (serviço que hospeda; GitLab, Bitbucket), com captura da página de commits
    do git/git. Prática só de leitura de histórico; sem terminal.'
- n: 2
  done: '2026-11-21'
  summary: 'Instalação (Windows instalador com Git Bash e GCM, macOS brew, Debian apt-get; Git 2.56, mínimo
    2.23). git config em três níveis (system, global, local; o mais próximo vence), --show-origin, --get-all,
    --unset; identidade user.name/email (Ana Ribeiro, horta comunitária), init.defaultBranch main, core.editor
    ''code --wait''. Identidade × credencial; senha recusada desde 13/08/2021; GCM (manager), helpers
    cache/store/osxkeychain; SSH ed25519 com analogia do cartão de assinatura do banco. Lab: deixar o
    Git pronto.'
- n: 3
  done: '2026-11-21'
  summary: 'Nasce o projeto receitas (index.html, receitas/bolo-de-cenoura.md): git init e a pasta .git;
    commit por dentro com git cat-file (tree, blob, hash, pai), snapshot que reaproveita o blob do index.html
    (9a16b95 → 9b3de16). Três áreas com a analogia do álbum de fotos (mesa = staging area). Estados untracked/staged/unmodified/modified;
    git status -s com duas colunas; o caso MM. .gitignore (.env, *.log, rascunhos/* com exceção !publicar.md;
    a armadilha rascunhos/), git check-ignore -v, --ignored, git rm --cached e o aviso de segredo já commitado.
    4 commits no lab.'
- n: 4
  done: '2026-11-21'
  summary: 'Commits como unidades de mudança: brigadeiro do Bruno com --author (autor × committer), a
    armadilha do git commit -am com arquivo novo. Mensagens: título até 50 caracteres no presente, linha
    em branco, corpo com o porquê (dois -m). git log com --oneline, --stat, -p, -n, --author, --grep,
    -- arquivo, --format; --since sem hora usa a hora atual. git show (e commit:arquivo), git diff × --staged
    × entre commits, git blame (-L, ^ de boundary). HEAD → main → commit; HEAD~n e HEAD^ (analogia do
    marcador de página no álbum). 7 commits: 80f839b brigadeiro, 3ea07e1 título, c33ad78 açúcar.'
- n: 5
  done: '2026-11-21'
  summary: 'Diagrama de decisão ''o que desfazer''. git restore (descarta edição; captura do VS Code com
    Discard Changes), --staged (lista-de-compras.txt), --source=9a16b95. Pudim: commit ''pudm'' sem o
    link corrigido com --amend (c8eed78 → 4ae3416). git switch --detach 9b3de16, cat .git/HEAD com hash,
    checkout antigo; commit solto 9cba308 (forno 200 °C) e aviso ao voltar. reset --soft/--mixed/--hard
    com estilo.css (A, ??, some) e o perigo do --hard com edição não commitada. git revert 3ea07e1 (título
    volta a Receitas da Ana; f8f33cf). Analogia: reset arranca fotos para a gaveta, revert cola foto nova.
    Reflog lido de baixo para cima; estilo.css recuperado com restore --source=38d0ae7 (aacc41a). Prazos
    90/30 dias.'
- n: 6
  done: '2026-11-21'
  summary: 'Branch como ponteiro (cat .git/refs/heads/sobremesas = hash, 41 bytes); analogia do marcador
    com etiqueta no álbum. git switch (mousse some da pasta na main), -c; erro ao trocar com edição não
    commitada. Stash: sem -u a torta fica; -u -m, list, pop, apply, drop. Fast-forward com corrige-pudim
    (7f4893c) e branch -d; merge de três vias da sobremesas (1586c98, dois pais, ort, --graph --all).
    git branch forno-200 9cba308 resgata o commit solto do cap. 5; -d recusa, -D apaga. Conflito no forno
    do bolo (forno-eletrico × palito): marcadores, captura do VS Code (Current/Incoming), resolução com
    as duas linhas, add, commit (433506c), --abort, git diff --check.'
- n: 7
  done: '2026-11-21'
  summary: 'Rebase × merge com a branch bebidas (4f9e111/172b51d viram 748e984/036c36f; author × committer;
    ORIG_HEAD; merge fast-forward); analogia das fotos tiradas de novo no álbum. Regra de ouro com diagrama
    de sequência (Ana, cópia compartilhada, Bruno). Conflito no rebase na branch porcoes (ovos): HEAD
    = nova base, detached HEAD, needs merge sem add, --continue, --abort, --skip; erro de usar git commit.
    rebase -i HEAD~4 no quindim: reword, squash, fixup, drop; apagar linha = drop; reset --hard ORIG_HEAD;
    --fixup/--autosquash em Para ir além. Main termina em 254d2d2, linear.'
- n: 8
  done: '2026-11-21'
  summary: 'Remoto de treino com git init --bare receitas.git (recusa de push em repositório normal).
    remote add/-v/set-url/rename; push -u (upstream); clone do Bruno com identidade local; status -sb
    ahead/behind. fetch × pull: [behind 1], main..origin/main, merge; push recusado (fetch first), pull
    sem configuração (divergent branches), pull --rebase (Ana 1597a4d). --force-with-lease na branch tortas
