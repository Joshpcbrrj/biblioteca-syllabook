ize="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Seguro em commits compartilhados</text><rect x="499.0" y="435.6" width="423.0" height="48.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="710.5" y="462.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Só em commits que ninguém mais tem</text></svg>
