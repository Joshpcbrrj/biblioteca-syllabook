s-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Conflito resolvido commit a commit</text><rect x="38" y="441.6" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="468.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Seguro em commits já compartilhados</text><rect x="499.0" y="441.6" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="468.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Só em commits que só você tem</text></svg>
