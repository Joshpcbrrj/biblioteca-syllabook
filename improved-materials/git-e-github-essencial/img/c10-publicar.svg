 y2="255.60000000000002" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="480.0" y="291.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">2. monta o site (até 10 min)</text><line x1="369.5" y1="299.6" x2="590.5" y2="299.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="701.0" y="335.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">3. abre &lt;usuario&gt;.github.io</text><line x1="811.5" y1="343.6" x2="590.5" y2="343.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="701.0" y="379.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">4. index.html</text><line x1="590.5" y1="387.6" x2="811.5" y2="387.6" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/><text x="480.0" y="466.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Configuração uma vez só (Settings → Pages); depois, cada push atualiza o site.</text></svg>
