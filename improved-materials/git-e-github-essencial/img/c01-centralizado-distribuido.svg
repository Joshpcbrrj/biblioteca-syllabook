<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>No modelo distribuído, cada computador guarda o histórico inteiro</title><desc>O servidor continua existindo no modelo distribuído: ele só deixa de ser o único lugar com o histórico.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">No modelo distribuído, cada computador guarda o histórico</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">inteiro</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="147.60000000000002" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="143.60000000000002" width="423.0" height="54.0" rx="12" fill="#E4E0D6" stroke="#B9B2A5" stroke-width="2"/><g transform="translate(52,157.6) scale(1.08333)" fill="none" stroke="#45454F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="88.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#2B2B33">Centralizado (SVN, CVS)</text><rect x="499.0" y="147.60000000000002" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="143.60000000000002" width="423.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(513,157.6) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g><text x="549.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#4F2F8C">Distribuído (Git, Mercurial)</text><rect x="38" y="209.60000000000002" width="423.0" height="48.0" rx="10" fill="#F4F2ED" stroke="#B9B2A5" stroke-width="2"/><text x="249.5" y="236.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Histórico só no servidor</text><rect x="499.0" y="209.60000000000002" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="236.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Histórico completo em cada cópia</text><rect x="38" y="267.6" width="423.0" height="48.0" rx="10" fill="#F4F2ED" stroke="#B9B2A5" stroke-width="2"/><text x="249.5" y="294.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Sem servidor, não há commit</text><rect x="499.0" y="267.6" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="294.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Commit offline, no seu disco</text><rect x="38" y="325.6" width="423.0" height="48.0" rx="10" fill="#F4F2ED" stroke="#B9B2A5" stroke-width="2"/><text x="249.5" y="352.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Ver o histórico exige rede</text><rect x="499.0" y="325.6" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="352.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">git log responde na hora</text><rect x="38" y="383.6" width="423.0" height="48.0" rx="10" fill="#F4F2ED" stroke="#B9B2A5" stroke-width="2"/><text x="249.5" y="410.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Servidor perdido, histórico perdido</text><rect x="499.0" y="383.6" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="410.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Qualquer cópia restaura o projeto</text><text x="480.0" y="476.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">O servidor continua existindo no modelo distribuído: ele só deixa de ser o único lugar com o</text><text x="480.0" y="497.40000000000003" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">histórico.</text></svg>
