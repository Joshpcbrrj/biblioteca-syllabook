<svg xmlns="http://www.w3.org/2000/svg" width="960" height="509" viewBox="0 0 960 509" role="img"><title>O remoto é o ponto de encontro: cada um envia com push e recebe com fetch</title><desc>O fetch só atualiza origin/main; a main da Ana avança no merge (ou no pull, que faz os dois).</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><line x1="774.6666666666667" y1="223.60000000000002" x2="774.6666666666667" y2="431.6" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><line x1="480.0" y1="223.60000000000002" x2="480.0" y2="431.6" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><line x1="185.33333333333334" y1="223.60000000000002" x2="185.33333333333334" y2="431.6" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">O remoto é o ponto de encontro: cada um envia com push e</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">recebe com fetch</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="44.0" y="147.60000000000002" width="282.6666666666667" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="44.0" y="143.60000000000002" width="282.6666666666667" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(58,157.6) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g><text x="94.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">Ana (receitas)</text><rect x="338.6666666666667" y="147.60000000000002" width="282.6666666666667" height="80.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="338.6666666666667" y="143.60000000000002" width="282.6666666666667" height="80.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(352.667,170.6) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="388.6666666666667" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">Remoto</text><text x="388.6666666666667" y="199.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">(receitas.git)</text><rect x="633.3333333333334" y="147.60000000000002" width="282.6666666666667" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="633.3333333333334" y="143.60000000000002" width="282.6666666666667" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(647.333,157.6) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g><text x="683.3333333333334" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">Bruno (clone)</text><text x="332.6666666666667" y="247.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">1. git push -u origin main</text><line x1="185.33333333333334" y1="255.60000000000002" x2="480.0" y2="255.60000000000002" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="627.3333333333334" y="291.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">2. git clone: cópia completa</text><line x1="480.0" y1="299.6" x2="774.6666666666667" y2="299.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="627.3333333333334" y="335.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">3. git push: 38b2299 pão de queijo</text><line x1="774.6666666666667" y1="343.6" x2="480.0" y2="343.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="332.6666666666667" y="379.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">4. git fetch: origin/main = 38b2299</text><line x1="480.0" y1="387.6" x2="185.33333333333334" y2="387.6" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/><text x="480.0" y="466.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">O fetch só atualiza origin/main; a main da Ana avança no merge (ou no pull, que faz os dois).</text></svg>
