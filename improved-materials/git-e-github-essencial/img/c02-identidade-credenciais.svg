do</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">servidor</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="147.60000000000002" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="143.60000000000002" width="423.0" height="54.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,157.6) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g><text x="88.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1F4E9C">Identidade</text><rect x="499.0" y="147.60000000000002" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="143.60000000000002" width="423.0" height="54.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(513,157.6) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 21 9.6-9.6"/><path d="m7.5 15.5 2.3 2.3a1 1 0 0 1 0 1.4l-2.1 2.1a1 1 0 0 1-1.4 0L4 19"/><circle cx="15.5" cy="7.5" r="5.5"/></g><text x="549.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#6E4D00">Credencial</text><rect x="38" y="209.60000000000002" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="236.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">user.name e user.email</text><rect x="499.0" y="209.60000000000002" width="423.0" height="74.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="710.5" y="236.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">token, login no navegador ou chave</text><text x="710.5" y="262.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">SSH</text><rect x="38" y="293.6" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="320.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Gravada dentro de cada commit</text><rect x="499.0" y="293.6" width="423.0" height="48.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="710.5" y="320.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Apresentada ao servidor no push</text><rect x="38" y="351.6" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="378.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Ninguém confere: aceita qualquer</text><text x="249.5" y="404.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">nome</text><rect x="499.0" y="351.6" width="423.0" height="74.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="710.5" y="378.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">O servidor recusa se for inválida</text><rect x="38" y="435.6" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="462.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Necessária para commitar</text><rect x="499.0" y="435.6" width="423.0" height="74.0" rx="10" fill="#FFF5D9" stroke="#E2B84A" stroke-width="2"/><text x="710.5" y="462.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Necessária para enviar e baixar</text><text x="710.5" y="488.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">privados</text></svg>
