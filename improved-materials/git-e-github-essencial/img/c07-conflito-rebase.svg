<svg xmlns="http://www.w3.org/2000/svg" width="960" height="843" viewBox="0 0 960 843" role="img"><title>No rebase, o conflito aparece no commit que está sendo reaplicado</title><desc>Em qualquer parada: git rebase --skip pula o commit; git rebase --abort volta a branch ao estado de antes.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">No rebase, o conflito aparece no commit que está sendo</text><text x="480.0" y="97.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">reaplicado</text><rect x="364.8" y="113.60000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="147.60000000000002" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="143.60000000000002" width="537.6" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,169.6) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g><text x="88.0" y="173.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1F4E9C">git rebase main</text><text x="88.0" y="198.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">reaplica 27b05fd, depois e42d1d6</text><line x1="306.8" y1="221.60000000000002" x2="306.8" y2="269.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><polygon points="306.8,269.6 516.464,308.6 306.8,347.6 97.136,308.6" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="311.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#6E4D00">Conflito neste commit?</text><rect x="632.6" y="273.6" width="289.4" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="269.6" width="289.4" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="777.3" y="299.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">Próximo commit</text><text x="777.3" y="324.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">ou fim do rebase</text><line x1="516.464" y1="308.6" x2="632.6" y2="308.6" stroke="#17694A" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="574.532" y="302.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17694A">não</text><line x1="306.8" y1="347.6" x2="306.8" y2="395.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="316.8" y="376.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">sim</text><rect x="38" y="399.6" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="395.6" width="537.6" height="78.0" rx="12" fill="#FFD3C5" stroke="#EE9478" stroke-width="2"/><g transform="translate(52,421.6) scale(1.08333)" fill="none" stroke="#963019" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></g><text x="88.0" y="425.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#963019">Edite o arquivo</text><text x="88.0" y="450.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">escolha o texto final e apague os marcadores</text><line x1="306.8" y1="473.6" x2="306.8" y2="521.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="38" y="525.6" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="521.6" width="537.6" height="78.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(52,547.6) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></g><text x="88.0" y="551.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#6E4D00">git add receitas/bolo-de-cenoura.md</text><text x="88.0" y="576.8000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">marca o conflito como resolvido</text><line x1="306.8" y1="599.6" x2="306.8" y2="647.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><rect x="38" y="651.6" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="647.6" width="537.6" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(52,673.6) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g><text x="88.0" y="677.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#17694A">git rebase --continue</text><text x="88.0" y="702.8000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">grava o commit e segue para o próximo</text><text x="480.0" y="779.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Em qualquer parada: git rebase --skip pula o commit; git rebase --abort volta a branch ao estado</text><text x="480.0" y="800.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">de antes.</text></svg>
