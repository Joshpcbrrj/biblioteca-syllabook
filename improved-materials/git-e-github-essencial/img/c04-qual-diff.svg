<svg xmlns="http://www.w3.org/2000/svg" width="960" height="562" viewBox="0 0 960 562" role="img"><title>Cada git diff compara duas áreas diferentes</title><desc>Se o git diff não mostra nada depois de um git add, a mudança está na staging area: use --staged.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Cada git diff compara duas áreas diferentes</text><text x="480.0" y="87.80000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">a seta diz qual comando mostra a diferença entre as duas caixas</text><rect x="364.8" y="105.4" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="96.0" y="139.4" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="135.4" width="768.0" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(110,161.4) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g><text x="146.0" y="165.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1F4E9C">Diretório de trabalho</text><text x="146.0" y="190.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">o que está no editor</text><line x1="480.0" y1="213.4" x2="480.0" y2="261.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="490.0" y="242.39999999999998" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">git diff</text><rect x="96.0" y="265.4" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="261.4" width="768.0" height="78.0" rx="12" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><g transform="translate(110,287.4) scale(1.08333)" fill="none" stroke="#6E4D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></g><text x="146.0" y="291.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#6E4D00">Staging area</text><text x="146.0" y="316.59999999999997" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">o que vai entrar no próximo commit</text><line x1="480.0" y1="339.4" x2="480.0" y2="387.4" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="490.0" y="368.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">git diff --staged</text><rect x="96.0" y="391.4" width="768.0" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="96.0" y="387.4" width="768.0" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><g transform="translate(110,413.4) scale(1.08333)" fill="none" stroke="#17694A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></g><text x="146.0" y="417.4" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#17694A">Último commit (HEAD)</text><text x="146.0" y="442.59999999999997" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">a última foto do álbum</text><text x="480.0" y="519.4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Se o git diff não mostra nada depois de um git add, a mudança está na staging area: use --staged.</text></svg>
