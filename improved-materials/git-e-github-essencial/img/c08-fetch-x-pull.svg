<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img"><title>O fetch só baixa; o pull baixa e integra na branch atual</title><desc>O fetch só baixa; o pull baixa e integra na branch atual</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">O fetch só baixa; o pull baixa e integra na branch atual</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="113.80000000000001" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="109.80000000000001" width="423.0" height="54.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,123.8) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8l-4-4"/><path d="m12 21 4-4"/><path d="M4.393 15.269A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.436 8.284"/></g><text x="88.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#1F4E9C">git fetch</text><rect x="499.0" y="113.80000000000001" width="423.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="499.0" y="109.80000000000001" width="423.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(513,123.8) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></g><text x="549.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#4F2F8C">git pull</text><rect x="38" y="175.8" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="202.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Baixa os commits novos</text><rect x="499.0" y="175.8" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="202.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Baixa os commits novos</text><rect x="38" y="233.8" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="260.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Atualiza origin/main</text><rect x="499.0" y="233.8" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="260.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Atualiza origin/main</text><rect x="38" y="291.8" width="423.0" height="48.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="318.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Não mexe na main nem nos arquivos</text><rect x="499.0" y="291.8" width="423.0" height="48.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="318.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Integra na branch atual</text><rect x="38" y="349.8" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="376.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Sempre seguro: dá para olhar antes</text><rect x="499.0" y="349.8" width="423.0" height="74.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="376.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Pode criar merge ou parar em</text><text x="710.5" y="402.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">conflito</text><rect x="38" y="433.8" width="423.0" height="74.0" rx="10" fill="#EAF1FF" stroke="#7FA8F0" stroke-width="2"/><text x="249.5" y="460.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">Depois: git merge ou git rebase</text><rect x="499.0" y="433.8" width="423.0" height="74.0" rx="10" fill="#F2EBFC" stroke="#A989E6" stroke-width="2"/><text x="710.5" y="460.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">É o mesmo que fetch + merge (ou</text><text x="710.5" y="486.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#2B2B33">rebase)</text></svg>
