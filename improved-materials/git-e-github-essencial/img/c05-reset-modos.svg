 -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">move o HEAD · mudanças voltam ao diretório de trabalho (?? estilo.css)</text><rect x="38" y="323.6" width="884" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="319.6" width="884" height="78.0" rx="12" fill="#FFD3C5" stroke="#EE9478" stroke-width="2"/><g transform="translate(52,345.6) scale(1.08333)" fill="none" stroke="#963019" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g><text x="88.0" y="349.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#963019">--hard</text><text x="88.0" y="374.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">move o HEAD · mudanças apagadas dos arquivos (estilo.css some)</text><text x="480.0" y="442.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Os três tiram o commit da branch; o reflog ainda guarda o commit por um tempo, mas não guarda</text><text x="480.0" y="463.40000000000003" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">edições nunca commitadas.</text></svg>
