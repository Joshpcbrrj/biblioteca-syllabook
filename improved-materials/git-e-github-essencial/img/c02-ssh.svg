<svg xmlns="http://www.w3.org/2000/svg" width="960" height="473" viewBox="0 0 960 473" role="img"><title>Com SSH, a chave privada nunca sai do seu computador</title><desc>Com SSH, a chave privada nunca sai do seu computador</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><line x1="701.0" y1="163.8" x2="701.0" y2="415.8" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><line x1="259.0" y1="163.8" x2="259.0" y2="415.8" stroke="#B9B2A5" stroke-width="2" stroke-dasharray="6 6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Com SSH, a chave privada nunca sai do seu computador</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="44.0" y="113.80000000000001" width="430.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="44.0" y="109.80000000000001" width="430.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(58,123.8) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="94.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">Seu computador</text><rect x="486.0" y="113.80000000000001" width="430.0" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="486.0" y="109.80000000000001" width="430.0" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(500,123.8) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g><text x="536.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">GitHub</text><text x="480.0" y="187.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">1. 1. Você cadastra a chave pública (uma vez)</text><line x1="259.0" y1="195.8" x2="701.0" y2="195.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="480.0" y="231.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">2. 2. Pedido de conexão com a chave pública</text><line x1="259.0" y1="239.8" x2="701.0" y2="239.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="480.0" y="275.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">3. 3. Desafio: prove que tem a chave privada</text><line x1="701.0" y1="283.8" x2="259.0" y2="283.8" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/><text x="480.0" y="319.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">4. 4. Resposta assinada com a chave privada</text><line x1="259.0" y1="327.8" x2="701.0" y2="327.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="480.0" y="363.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2B33">5. 5. Assinatura confere: acesso liberado</text><line x1="701.0" y1="371.8" x2="259.0" y2="371.8" stroke="#45454F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-gray)"/></svg>
