<svg xmlns="http://www.w3.org/2000/svg" width="960" height="827" viewBox="0 0 960 827" role="img"><title>Para escolher o comando, pergunte onde o erro está</title><desc>Na dúvida, prefira o comando que cria histórico novo (revert) ao que reescreve o histórico (amend, reset).</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9C"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17694A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E4D00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#963019"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F2F8C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#125B5B"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45454F"/></marker><linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FA8F0"/><stop offset="0.333333" stop-color="#A989E6"/><stop offset="0.666667" stop-color="#EE9478"/><stop offset="1" stop-color="#E2B84A"/></linearGradient></defs><rect width="100%" height="100%" fill="#FAF9F6"/><text x="480.0" y="64.0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2B2B33">Para escolher o comando, pergunte onde o erro está</text><rect x="364.8" y="79.80000000000001" width="230.39999999999998" height="5" rx="2.5" fill="url(#underline)"/><rect x="38" y="113.80000000000001" width="537.6" height="54.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="109.80000000000001" width="537.6" height="54.0" rx="12" fill="#E0D1F8" stroke="#A989E6" stroke-width="2"/><g transform="translate(52,123.8) scale(1.08333)" fill="none" stroke="#4F2F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 9.5a3 2.5 0 016 0c0 2-2 2-3 3.5"/><path d="M12 17h.01"/></g><text x="88.0" y="139.8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#4F2F8C">O que você quer desfazer?</text><line x1="306.8" y1="163.8" x2="306.8" y2="211.8" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><polygon points="306.8,211.8 516.464,248.20000000000002 306.8,284.6 97.136,248.20000000000002" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="250.60000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6E4D00">A mudança já está num commit?</text><g transform="translate(0,-13)"><rect x="632.6" y="215.8" width="289.4" height="98.80000000000001" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="211.8" width="289.4" height="98.80000000000001" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="777.3" y="241.80000000000004" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">git restore &lt;arquivo&gt;</text><text x="777.3" y="267.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">na staging area: git restore</text><text x="777.3" y="287.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">--staged</text></g><line x1="516.464" y1="248.20000000000002" x2="632.6" y2="248.20000000000002" stroke="#17694A" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="574.532" y="242.20000000000002" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17694A">não</text><line x1="306.8" y1="310.6" x2="306.8" y2="358.6" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="316.8" y="339.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">sim</text><polygon points="306.8,358.6 516.464,395.0 306.8,431.40000000000003 97.136,395.0" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="397.40000000000003" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6E4D00">O commit já foi compartilhado?</text><g transform="translate(0,-13)"><rect x="632.6" y="362.6" width="289.4" height="98.80000000000001" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="358.6" width="289.4" height="98.80000000000001" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="777.3" y="388.6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">git revert &lt;commit&gt;</text><text x="777.3" y="413.8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">cria um commit que desfaz o</text><text x="777.3" y="434.6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">outro</text></g><line x1="516.464" y1="395.0" x2="632.6" y2="395.0" stroke="#17694A" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="574.532" y="389.0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17694A">sim</text><line x1="306.8" y1="457.40000000000003" x2="306.8" y2="505.40000000000003" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="316.8" y="486.40000000000003" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">não</text><polygon points="306.8,505.40000000000003 516.464,541.8000000000001 306.8,578.2 97.136,541.8000000000001" fill="#FFE7A6" stroke="#E2B84A" stroke-width="2"/><text x="306.8" y="544.2" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6E4D00">O erro está no último commit?</text><g transform="translate(0,-2.6)"><rect x="632.6" y="509.40000000000003" width="289.4" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="632.6" y="505.40000000000003" width="289.4" height="78.0" rx="12" fill="#C9ECD9" stroke="#6FC39C" stroke-width="2"/><text x="777.3" y="535.4000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#17694A">git commit --amend</text><text x="777.3" y="560.6000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F">corrige mensagem ou arquivos</text></g><line x1="516.464" y1="541.8000000000001" x2="632.6" y2="541.8000000000001" stroke="#17694A" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="574.532" y="535.8000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17694A">sim</text><line x1="306.8" y1="583.4000000000001" x2="306.8" y2="631.4000000000001" stroke="#45454F" stroke-width="2.5" marker-end="url(#arrow-gray)"/><text x="316.8" y="612.4000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#45454F">não</text><rect x="38" y="635.4000000000001" width="537.6" height="78.0" rx="12" fill="#3A3226" opacity="0.07"/><rect x="38" y="631.4000000000001" width="537.6" height="78.0" rx="12" fill="#D3E2FF" stroke="#7FA8F0" stroke-width="2"/><g transform="translate(52,657.4) scale(1.08333)" fill="none" stroke="#1F4E9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g><text x="88.0" y="661.4000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1F4E9C">git reset</text><text x="88.0" y="686.6000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#55555F">--soft, --mixed ou --hard (cuidado)</text><text x="480.0" y="763.4000000000001" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">Na dúvida, prefira o comando que cria histórico novo (revert) ao que reescreve o histórico (amend,</text><text x="480.0" y="784.2" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#55555F" font-style="italic">reset).</text></svg>
